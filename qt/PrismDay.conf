# PrismDay colour scheme for qt5ct / qt6ct, part of cosmic-prismday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> PrismDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#242b3d, #eef8f9, #eef8f9, #cbd6d8, #d5e0e2, #d5e0e2, #242b3d, #171e30, #242b3d, #eef8f9, #dfeaec, #d5e0e2, #804c4f, #dfeaec, #804c4f, #963e36, #eef8f9, #dfeaec, #eef8f9, #242b3d, #515b7c
disabled_colors=#7b8cad, #eef8f9, #eef8f9, #cbd6d8, #d5e0e2, #d5e0e2, #7b8cad, #306b65, #7b8cad, #dfeaec, #dfeaec, #d5e0e2, #cbd6d8, #306b65, #515b7c, #515b7c, #eef8f9, #dfeaec, #eef8f9, #242b3d, #cbd6d8
inactive_colors=#242b3d, #eef8f9, #eef8f9, #cbd6d8, #d5e0e2, #d5e0e2, #242b3d, #171e30, #242b3d, #eef8f9, #dfeaec, #d5e0e2, #804c4f, #dfeaec, #804c4f, #963e36, #eef8f9, #dfeaec, #eef8f9, #242b3d, #515b7c
