# PrismDay for Alacritty, part of cosmic-prismday-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/prismday.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#DFEAEC"
foreground = "#242B3D"
bright_foreground = "#171E30"
dim_foreground = "#515B7C"

[colors.cursor]
text = "#DFEAEC"
cursor = "#804C4F"

[colors.vi_mode_cursor]
text = "#DFEAEC"
cursor = "#963E36"

[colors.selection]
text = "CellForeground"
background = "#CBD6D8"

[colors.search.matches]
foreground = "#DFEAEC"
background = "#526664"

[colors.search.focused_match]
foreground = "#DFEAEC"
background = "#804C4F"

[colors.hints.start]
foreground = "#DFEAEC"
background = "#963E36"

[colors.hints.end]
foreground = "#DFEAEC"
background = "#526664"

[colors.footer_bar]
foreground = "#242B3D"
background = "#EEF8F9"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#D5E0E2"
red     = "#B52817"
green   = "#2347A9"
yellow  = "#526664"
blue    = "#804C4F"
magenta = "#963E36"
cyan    = "#306B65"
white   = "#48505C"

[colors.bright]
black   = "#7B8CAD"
red     = "#912012"
green   = "#1D3B8B"
yellow  = "#445553"
blue    = "#6D4143"
magenta = "#78322B"
cyan    = "#306B65"
white   = "#171E30"

[colors.dim]
black   = "#DFEAEC"
red     = "#E5422F"
green   = "#3D66D7"
yellow  = "#78928F"
blue    = "#485E84"
magenta = "#C4635A"
cyan    = "#408E86"
white   = "#4D5670"
